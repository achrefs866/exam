name: CI-CD Monitoring

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: Build image & Test Flask
    runs-on: ubuntu-latest  # toujours nécessaire pour GitHub Actions, même si Docker local

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Build de l’image Flask
      - name: Build Flask image
        run: docker build -t flask-monitoring-app .

      # 3️⃣ Lancer le conteneur Flask pour les tests
      - name: Run Flask container for testing
        run: |
          docker run -d --name flask-test -p 5000:5000 flask-monitoring-app
          sleep 8

      # 4️⃣ Exécuter le script de test
      - name: Run test script
        run: |
          chmod +x ./advanced-monitoring/test_app.sh
          ./advanced-monitoring/test_app.sh

