name: CI-CD Monitoring

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: Build image & Test Flask
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker + docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io docker-compose

      - name: Build Flask image
        run: docker build -t flask-monitoring-app .

      - name: Run Flask container for testing
        run: |
          docker run -d --name flask-test -p 5000:5000 flask-monitoring-app
          sleep 8

      - name: Run test script
        run: |
          chmod +x ./advanced-monitoring/test_app.sh
          ./advanced-monitoring/test_app.sh

      - name: Stop test container
        if: always()
        run: docker rm -f flask-test || true

  deploy:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker + docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io docker-compose

      - name: Deploy stack in advanced-monitoring/
        working-directory: ${{ github.workspace }}/advanced-monitoring
        run: |
          docker-compose up -d
